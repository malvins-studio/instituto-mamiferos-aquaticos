services:
  db:
    image: postgres:16-alpine
    container_name: siima_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siima
      POSTGRES_PASSWORD: siima_dev_password
      POSTGRES_DB: siima
    ports:
      - "5432:5432"
    volumes:
      - siima_postgres_data:/var/lib/postgresql/data

volumes:
  siima_postgres_data:
